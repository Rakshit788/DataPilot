services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: datapilot
      POSTGRES_USER: datapilot_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    ports:
      - "5432:5432"
    volumes:
      - datapilot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datapilot_app -d datapilot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  datapilot-postgres:
